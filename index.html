<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Delve</title>
    <style>
      :root {
        --bg: #0e0d0c;
        --surface: #191715;
        --surface-2: #221f1c;
        --line: #332e29;
        --text: #efe8de;
        --muted: #9a9086;
        --accent: #e0a44a;
        --accent-soft: rgba(224, 164, 74, 0.14);
        --blood: #d4574b;
        --lens: #62f58a;
        --lens-dim: rgba(98, 245, 138, 0.55);
        --lens-faint: rgba(98, 245, 138, 0.25);
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      .wrap { max-width: 680px; margin: 0 auto; padding: 14px 16px 90px; }

      .top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
      .brand { font-size: 22px; font-weight: 800; letter-spacing: 0.14em; margin: 0; }
      .brand span { color: var(--accent); }
      .top .spacer { flex: 1; }
      .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
      .pill.ok { color: var(--lens); border-color: rgba(98, 245, 138, 0.35); }
      .pill.warn { color: var(--accent); border-color: rgba(224, 164, 74, 0.4); }

      /* the lens mirror: same geometry as the glasses, 576x288 */
      .lens {
        position: relative; width: 100%; aspect-ratio: 2 / 1; background: #000; border-radius: var(--radius);
        border: 1px solid #1d2a20; overflow: hidden; color: var(--lens); container-type: inline-size;
        font-family: ui-sans-serif, system-ui, sans-serif; font-size: 2.95cqw; line-height: 4.69cqw; letter-spacing: -0.01em;
      }
      .lens > div { position: absolute; white-space: pre-wrap; overflow: hidden; }
      .lens .l-hdr, .lens .l-ftr { white-space: pre; }
      .lens .l-hdr { left: 0.7%; top: 1.2%; width: 98.6%; height: 11%; color: var(--lens-dim); }
      .lens .l-art { left: 0.7%; top: 13.9%; width: 23.6%; height: 47.2%; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--lens-faint); }
      .lens .l-art svg { width: 72%; height: 72%; }
      .lens .l-art.dim { opacity: 0.35; }
      .lens .l-cap { left: 0.7%; top: 63%; width: 24.3%; height: 24%; color: rgba(98, 245, 138, 0.8); }
      .lens .l-body { left: 25.3%; top: 12.8%; width: 74.3%; height: 74.3%; border: 1px solid var(--lens-faint); border-radius: 1.4cqw; padding: 1.2cqw 1.5cqw; }
      /* game layout: story strip (x146 y37 430x92) over the pill list (y129 h122) */
      .lens .l-story { left: 25.3%; top: 12.8%; width: 74.7%; height: 31.9%; padding: 0.7cqw; }
      .lens .l-list { left: 25.3%; top: 44.8%; width: 74.7%; height: 42.4%; display: flex; flex-direction: column; gap: 0; padding: 0.35cqw; }
      .lens .l-list span { display: block; padding: 0.9cqw 1.6cqw; margin-right: auto; border: 1px solid transparent; border-radius: 1.4cqw; color: var(--lens-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
      .lens .l-list span.sel { border-color: var(--lens); color: var(--lens); }
      .lens .l-ftr { left: 0.7%; top: 88.5%; width: 98.6%; height: 11%; color: var(--lens-dim); }

      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 12px; }
      .card h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .opt {
        border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 9px 16px;
        min-height: 42px; text-align: left; max-width: 100%;
      }
      .opt:hover, .opt:focus-visible { border-color: var(--lens); color: var(--lens); outline: none; }
      .opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
      .opt:active { background: var(--accent-soft); }

      .say { display: flex; gap: 8px; margin-top: 12px; }
      .say input {
        flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
        padding: 10px 12px; outline: none;
      }
      .say input:focus { border-color: var(--accent); }
      .btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 14px; white-space: nowrap; }
      .btn.primary { background: var(--accent); color: #1a1208; border-color: var(--accent); font-weight: 700; }
      .btn.danger { color: var(--blood); border-color: rgba(212, 87, 75, 0.5); }
      .mic { width: 100%; margin-top: 12px; padding: 14px; font-weight: 700; font-size: 16px; }
      .mic.live { background: var(--blood); border-color: var(--blood); color: #fff; }

      .tabs { display: flex; gap: 4px; margin-top: 16px; overflow-x: auto; scrollbar-width: none; }
      .tabs button { border: 1px solid transparent; background: none; border-radius: 999px; padding: 6px 12px; color: var(--muted); white-space: nowrap; }
      .tabs button.on { background: var(--surface); border-color: var(--line); color: var(--text); }
      .panel { white-space: pre-wrap; }
      .log p { margin: 0 0 10px; }
      .log .you { color: var(--accent); }
      .log .you::before { content: "» "; }
      .log .dm { font-style: italic; }
      .log .story { color: var(--muted); }

      .field { display: grid; gap: 6px; margin-bottom: 14px; }
      .field label { font-size: 13px; color: var(--muted); }
      .row { display: flex; gap: 8px; align-items: center; }
      .row input[type="text"], .row select { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
      .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
      .toggle small { display: block; color: var(--muted); font-size: 12px; }
      .toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
      .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
      .credits { font-size: 12px; color: var(--muted); }
      .items .it { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      .items .it:first-child { border-top: 0; }
      .items small { color: var(--muted); display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
