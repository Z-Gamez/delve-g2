<!doctype html>
<!--
  Dev-only voice harness (served by `npm run dev` at /test/voice.html; never
  built). Fakes the Even host so the real app code runs as if on the glasses:
  every SDK call is logged in window.__calls, and window.say('bolt') streams
  test/fixtures/bolt.wav in as G2 mic frames (PCM s16le 16 kHz, 100 ms each)
  while the app has the mic open -- the same path real speech takes.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Delve voice harness</title>
    <link rel="stylesheet" href="/index.html" />
  </head>
  <body style="background:#0e0d0c;color:#eee">
    <div id="app"></div>
    <script>
      const params = new URLSearchParams(location.search)
      const serverUrl = params.get('server') || 'http://127.0.0.1:8790'
      // ?speech=openai|openrouter: cloud speech against a stubbed API. The
      // clip's words come back as the transcript (window.__sttText), and each
      // request is kept in window.__stt for inspection.
      const speech = params.get('speech') || 'server'
      window.__calls = []
      window.__mic = false
      window.__stt = []
      window.__sttText = ''
      const store = { 'delve.settings': JSON.stringify({ server: serverUrl, ai: true, handsFree: false, speech, keys: speech === 'server' ? {} : { [speech]: 'sk-test' } }) }
      if (speech !== 'server') {
        const realFetch = window.fetch.bind(window)
        window.fetch = async (url, init) => {
          const u = String(url)
          if (u.endsWith('/v1/audio/transcriptions') || (u.endsWith('/api/v1/chat/completions') && String(init?.body).includes('input_audio'))) {
            window.__stt.push({ url: u, init, at: Date.now() })
            const text = window.__sttText
            return new Response(JSON.stringify(u.includes('openai') ? { text } : { choices: [{ message: { content: text } }] }), { status: 200 })
          }
          if (u.endsWith('/v1/models') && u.includes('openai')) return new Response(JSON.stringify({ data: [{ id: 'whisper-1' }, { id: 'gpt-4o-mini-transcribe' }] }), { status: 200 })
          return realFetch(url, init)
        }
      }
      window.flutter_inappwebview = {
        callHandler: async (name, payload) => {
          let msg = payload
          try { msg = typeof payload === 'string' ? JSON.parse(payload) : payload } catch {}
          const method = msg && (msg.method || msg.type)
          const data = msg && msg.data
          window.__calls.push({ name, method, data })
          if (method === 'audioControl') window.__mic = !!(data && (data.isOpen ?? data.open ?? data[0]))
          if (method === 'getLocalStorage') return store[data && data.key] || ''
          if (method === 'setLocalStorage') { store[data.key] = data.value; return true }
          if (method === 'createStartUpPageContainer') return 0
          if (method === 'updateImageRawData') return 'success'
          return true
        },
      }
      window.say = async (name, { tailMs = 1800 } = {}) => {
        const buf = new Uint8Array(await (await fetch(`/test/fixtures/${name}.wav`)).arrayBuffer())
        const pcm = buf.slice(44)
        const frame = 3200
        const wait = ms => new Promise(r => setTimeout(r, ms))
        for (let i = 0; i < 60 && !window.__mic; i++) await wait(50)
        if (!window.__mic) return 'mic never opened'
        const silence = new Uint8Array(frame)
        const frames = []
        for (let i = 0; i < 3; i++) frames.push(silence)
        for (let o = 0; o < pcm.length; o += frame) frames.push(pcm.slice(o, o + frame))
        for (let t = 0; t < tailMs; t += 100) frames.push(silence)
        for (const f of frames) {
          if (!window.__mic) break
          window.EvenAppBridge.handleEvenHubEventChanged({ type: 'audioEvent', jsonData: { audioPcm: Array.from(f) } })
          await wait(100)
        }
        return 'sent'
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
